name: Release Installer

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Release version used for the installer filename and app metadata
        required: false
        default: 1.0.0

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $version = "${{ github.event.release.tag_name }}"
          }
          elseif ("${{ github.event.inputs.version }}") {
            $version = "${{ github.event.inputs.version }}"
          }
          else {
            $version = "1.0.0"
          }

          $version = $version.Trim()
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }

          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Configuration Release -Runtime win-x64 -Version "${{ steps.version.outputs.value }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuczLocalConnect-Setup-${{ steps.version.outputs.value }}
          path: dist\DuczLocalConnect-Setup-${{ steps.version.outputs.value }}.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist\DuczLocalConnect-Setup-${{ steps.version.outputs.value }}.exe
